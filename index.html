<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GRASS v1.4.4 | WIND + REALISM Demo</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #b9d8ff; font-family: Arial, sans-serif; }
    #app { width: 100%; height: 100%; }
    #ui {
      position: fixed; left: 12px; top: 12px; z-index: 10;
      background: rgba(20, 24, 20, 0.75); color: white; padding: 12px 14px;
      border-radius: 10px; min-width: 260px; backdrop-filter: blur(6px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.2);
    }
    #ui h1 { font-size: 15px; margin: 0 0 8px; }
    #ui .row { margin: 10px 0; }
    #ui label { display: block; font-size: 12px; margin-bottom: 4px; opacity: 0.95; }
    #ui input[type=range], #ui input[type=number] { width: 100%; }
    #ui .small { font-size: 11px; line-height: 1.5; color: #d5e6d5; }
    #msg {
      position: fixed; right: 12px; bottom: 12px; z-index: 10;
      background: rgba(255,255,255,0.8); color: #223; padding: 8px 10px;
      border-radius: 8px; font-size: 12px;
    }
    button { cursor: pointer; padding: 6px 10px; border-radius: 8px; border: none; }
    @media(max-width:600px){
      #ui{left:8px;top:8px;right:8px;min-width:0;padding:10px 12px;}
      #ui h1{font-size:14px;}
      #ui .row{margin:7px 0;}
      #msg{left:8px;right:8px;bottom:8px;font-size:11px;}
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui">
    <h1>GRASS v1.4.4 | WIND + REALISM</h1>
    <div class="row">
      <label for="amp">風の強さ <span id="ampVal">0.35</span></label>
      <input id="amp" type="range" min="0" max="0.60" step="0.005" value="0.35" />
    </div>
    <div class="row">
      <label for="speed">風の速さ <span id="speedVal">1.0</span></label>
      <input id="speed" type="range" min="0" max="3" step="0.01" value="1.0" />
    </div>
    <div class="row">
      <label for="tiles">タイル数（奇数推奨）</label>
      <input id="tiles" type="number" min="1" max="9" step="2" value="1" />
    </div>
    <div class="row">
      <button id="rebuild">芝生を再配置</button>
    </div>
    <div class="small">
      4m × 4m 芝生タイル｜ドラッグで回転・スクロールで拡大縮小。<br>
      公開サイト上ではローカルサーバーは不要です。
    </div>
  </div>
  <div id="msg">読み込み中...</div>
  <script type="importmap">
  {"imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }}
  </script>
  <script>
    window.addEventListener('error', e => { document.getElementById('msg').textContent = 'JS error: ' + e.message; });
    window.addEventListener('unhandledrejection', e => { document.getElementById('msg').textContent = '読み込みエラー: ' + (e.reason?.message || e.reason); });
  </script>
  <script type="module" src="./main.js?v=webapp_144"></script>
</body>
</html>
